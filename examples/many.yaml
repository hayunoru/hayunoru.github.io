  - id: pass
    title: PASS
    size: full
    blocks:
      - type: secret
        name: password.txt
        note: パスワードマネージャの復旧に必要なもの一式
        text: |
          manager   : Bitwarden（例）
          url       : https://vault.example.com
          email     : me@example.com
          master    : correct-horse-battery-staple-orbit-lantern
          2fa       : TOTP の GOOGLE
          emergency : 緊急アクセスは佐藤さくら に設定済み
          export    : 月 1 回、暗号化エクスポートを USB に保存
          ---
          recovery  : XXXX-XXXX-XXXX-XXXX-XXXX-XXXX
          notes     : 保管庫を開いたら、まずメールのパスワードを変える
      - entries:
          - name: CONOHA
            fields:
              - { label: ID, value: me@example.com }
              - { label: PW, value: Xk29-pq7L-c0nO-88vR, secret: true }
              - { label: API, value: 0000aaaa1111bbbb2222cccc3333dddd, secret: true }
          - name: CARRIER
            sub: キャリア名（例）
            fields:
              - { label: 回線, value: 090-0000-0000, type: tel }
              - { label: ID, value: example-login }
              - { label: PW, value: carrier-pass-0000, secret: true }
              - { label: 暗証番号, value: "0000", secret: true }
          - name: GMAIL
            fields:
              - { label: ID, value: me@example.com }
              - { label: PW, value: gm-Very-Long-Password-0000-Example, secret: true }
          - name: 自宅 Wi-Fi
            fields:
