  - id: device
    title: DEVICE
    subtitle: 失くした端末の後始末
    blocks:
      - entries:
          - { name: スマホ（例）, sub: 2025 年購入, fields: [{ label: IMEI, value: "350000000000000" }, { label: 電話番号, value: 090-0000-0000, type: tel }] }
          - { name: ノートPC（例）, fields: [{ label: S/N, value: EXAMPLE0001 }] }
          - { name: タブレット（例）, fields: [{ label: S/N, value: EXAMPLE0002 }] }
          - { name: スマートウォッチ（例）, fields: [{ label: S/N, value: EXAMPLE0003 }] }
      - text: "端末を探す: [Google デバイスを探す](https://www.google.com/android/find)"
      - type: list
        title: REVOKE
        ordered: true
        items:
          - Google のデバイス一覧から、失くした端末をログアウト
          - GitHub の SSH 鍵と Personal Access Token を失効
          - Discord のログイン中の端末を削除
          - サーバの authorized_keys から、失くした端末の鍵を削除
          - ConoHa の API トークンを再発行
          - npm のアクセストークンを失効
          - GPG 鍵の失効証明書を公開（失効証明書は password.txt の場所に）
          - パスワードマネージャのセッションを全て切断

  - id: money
    title: MONEY
    subtitle: 紛失・盗難の窓口
    blocks:
