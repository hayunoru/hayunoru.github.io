# 見た目確認用：項目が多い場合（すべてダミー）
site:
  title: 非常口

sections:
  - id: readme
    title: README
    blocks:
      - steps:
          - 端末を用意する。できれば家族や友人など、信頼できる人のもの
          - "[](#pass) の password.txt でパスワードマネージャを開く。ほとんどのパスワードはそこにある"
          - "Google に [](#codes) のバックアップコードでログインし、2段階認証を再設定する"
          - "[](#totp) のシードを新しい認証アプリに手入力で登録し直す。QR がなくても登録できる"
          - "[](#device) の手順で、失くした端末のセッションと鍵を失効させる"
          - "財布もなければ [](#money) の窓口でカードを止める"
          - スマホ紛失なら、キャリアで SIM を再発行する。本人確認書類が要る
          - "身分証を失くしたら [](#id) の番号を控えて再発行の手続きへ"
          - "火事や事故なら [](#insurance) の受付へ。片付ける前に写真を撮る"
          - "家族や友人には [](#contact) から連絡。無事だと伝える"
          - 落ち着いたら、使ったコードの再発行と合言葉の変更
          - このページを作り直す（npm run restore → 編集 → npm run build）
      - text: |
          借りた端末で合言葉を入力した場合は、落ち着いてから合言葉を変えて作り直すこと。
      - note: (｀・ω・´)ゞ 落ち着いて、一つずつ。

