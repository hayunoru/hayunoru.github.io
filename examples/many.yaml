              - { label: PW, value: wifi-pass-0000, secret: true }
          - name: ルーター管理画面
            fields:
              - { label: URL, value: http://192.168.0.1, type: url }
              - { label: PW, value: admin-0000, secret: true }
          - name: プロバイダ
            sub: 〇〇光（例）
            fields:
              - { label: 契約番号, value: COP0000000 }
              - { label: サポート, value: 0120-000-010, type: tel }
          - name: 証券口座
            fields:
              - { label: 口座番号, value: 000-0000000 }
              - { label: PW, value: sec-pass-0000, secret: true }
              - { label: 取引PW, value: trade-0000, secret: true }
          - name: マンションのオートロック
