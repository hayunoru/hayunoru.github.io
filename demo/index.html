<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src &#39;none&#39;; script-src &#39;unsafe-inline&#39; &#39;wasm-unsafe-eval&#39;; style-src &#39;unsafe-inline&#39; https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data:; connect-src &#39;none&#39;; base-uri &#39;none&#39;; form-action &#39;none&#39;">
<meta name="color-scheme" content="dark">
<title>非常口</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=BIZ+UDGothic:wght@400;700&display=swap">
<style>
:root{--accent:#5fe3ff;--warn:#ffc35a;}
/* 非常口 — HUD 計器テーマ
 * 色は :root の変数で決まる。--accent と --warn は設定ファイル（site.theme）で上書きされる。 */
:root {
  --bg: #070d12;
  --panel: rgba(11, 20, 27, 0.9);
  --line: #1b3442;
  --line-soft: #12232d;
  --mid: #2f7f95;
  --text: #cfeaf2;
  --dim: #6f95a3;
  --hi: #effbff;
  --placeholder: #2f5a68;
  --glow: color-mix(in srgb, var(--accent) 45%, transparent);
  --glow-soft: color-mix(in srgb, var(--accent) 14%, transparent);
  --grid: color-mix(in srgb, var(--accent) 4%, transparent);
  --warn-text: color-mix(in srgb, var(--warn) 55%, #ffffff);
  --mono: 'Share Tech Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'BIZ UDGothic', monospace;
  --jp: 'BIZ UDGothic', 'Hiragino Sans', 'Yu Gothic UI', 'Meiryo', sans-serif;
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; scroll-padding-top: 16px; }

body {
  margin: 0;
  min-height: 100vh;
  background-color: var(--bg);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 40px 40px;
  color: var(--text);
  font-family: var(--mono);
  font-size: 14px;
  line-height: 1.75;
}

a { color: var(--accent); }
a:hover { color: var(--hi); }
::selection { background: var(--accent); color: var(--bg); }
:focus-visible { outline: 1px solid var(--hi); outline-offset: 3px; }

.noscript { padding: 24px; font-family: var(--jp); }
.jp { font-family: var(--jp); }
.dim { color: var(--dim); }
.hi { color: var(--hi); }

/* ---------- 共通：上端の状態バー ---------- */
.topbar {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 4px 16px;
  padding: 14px 20px 10px;
  color: var(--dim);
  font-size: 13px;
  letter-spacing: 0.08em;
}
.status { display: inline-flex; align-items: center; gap: 8px; }
.status-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  border: 1.5px solid var(--dim);
}
.status-dot.on {
  border-color: var(--accent);
  background: var(--accent);
  box-shadow: 0 0 6px var(--accent);
}
.glowline {
  height: 1px;
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent);
  opacity: 0.7;
}
.ruler {
  height: 14px;
  margin: 0 20px 16px;
  background-image:
    repeating-linear-gradient(90deg, var(--mid) 0 1px, transparent 1px 10px),
    repeating-linear-gradient(90deg, var(--accent) 0 1px, transparent 1px 100px);
  background-size: auto 6px, auto 14px;
  background-repeat: repeat-x;
  background-position: 0 100%, 0 100%;
  opacity: 0.6;
}

/* ---------- パネル（角ブラケット） ---------- */
.panel {
  position: relative;
  border: 1px solid var(--line);
  background: var(--panel);
}
.panel::before,
.panel::after,
.panel > .c-tr,
.panel > .c-bl {
  content: '';
  position: absolute;
  width: 14px;
  height: 14px;
  pointer-events: none;
}
.panel::before { top: -1px; left: -1px; border-top: 2px solid var(--tone, var(--accent)); border-left: 2px solid var(--tone, var(--accent)); }
.panel::after { bottom: -1px; right: -1px; border-bottom: 2px solid var(--tone, var(--accent)); border-right: 2px solid var(--tone, var(--accent)); }
.panel > .c-tr { top: -1px; right: -1px; border-top: 2px solid var(--tone, var(--accent)); border-right: 2px solid var(--tone, var(--accent)); }
.panel > .c-bl { bottom: -1px; left: -1px; border-bottom: 2px solid var(--tone, var(--accent)); border-left: 2px solid var(--tone, var(--accent)); }
.panel.big::before,
.panel.big::after,
.panel.big > .c-tr,
.panel.big > .c-bl { width: 18px; height: 18px; }
.panel.big::before,
.panel.big::after { filter: drop-shadow(0 0 3px var(--tone, var(--accent))); }
.panel.emphasis {
  border-color: var(--mid);
  box-shadow: 0 0 18px var(--glow-soft);
}
.tone-warn { --tone: var(--warn); }

/* ---------- ボタン ---------- */
.btn {
  min-height: 36px;
  padding: 0 14px;
  background: transparent;
  border: 1px solid var(--mid);
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
  letter-spacing: 0.06em;
  cursor: pointer;
  white-space: nowrap;
}
.btn:hover { border-color: var(--accent); color: var(--hi); box-shadow: 0 0 8px var(--glow-soft); }
.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  min-height: 36px;
  padding: 0 16px;
  background: var(--accent);
  border: 1px solid var(--accent);
  color: var(--bg);
  font-family: inherit;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-decoration: none;
  cursor: pointer;
  box-shadow: 0 0 14px var(--glow);
}
.btn-primary:hover { color: var(--bg); filter: brightness(1.1); }
.btn-primary:disabled { opacity: 0.6; cursor: wait; }

/* ---------- ロック画面 ---------- */
.lock-screen {
  position: relative;
  overflow: hidden;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}
.scan {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 120px;
  background: linear-gradient(transparent, var(--grid), transparent);
  animation: scan 7s linear infinite;
  pointer-events: none;
}
@keyframes scan { from { transform: translateY(-120px); } to { transform: translateY(100vh); } }
.lock-center {
  flex: 1 1 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 16px;
}
.lock-panel {
  width: 100%;
  max-width: 640px;
  padding: 34px 30px 28px;
  display: flex;
  flex-direction: column;
  gap: 22px;
}
.lock-label { font-size: 12px; letter-spacing: 0.3em; color: var(--accent); }
.lock-title {
  margin: 0;
  font-family: var(--jp);
  font-weight: 700;
  font-size: 50px;
  letter-spacing: 0.2em;
  line-height: 1.25;
  color: var(--hi);
  text-shadow: 0 0 16px var(--glow);
  overflow-wrap: anywhere;
}
.lock-greeting { color: var(--dim); font-size: 13px; font-family: var(--jp); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); padding: 2px 10px; font-size: 12px; letter-spacing: 0.08em; }
.chip > span { color: var(--dim); margin-right: 6px; }
.pass-label { font-size: 12px; letter-spacing: 0.25em; color: var(--accent); }
.pass-row { display: flex; flex-wrap: wrap; gap: 10px; }
.pass-input {
  flex: 1 1 260px;
  min-width: 0;
  height: 50px;
  background: var(--bg);
  border: 1px solid var(--mid);
  color: var(--hi);
  font-family: inherit;
  font-size: 18px;
  letter-spacing: 0.15em;
  padding: 0 16px;
  border-radius: 0;
}
.pass-input::placeholder { color: var(--placeholder); }
.pass-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 10px var(--glow); }
.pass-row .btn-primary { height: 50px; padding: 0 22px; }
.check { display: flex; align-items: center; gap: 10px; min-height: 36px; font-size: 13px; color: var(--dim); font-family: var(--jp); cursor: pointer; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }
.lock-msg { min-height: 1.75em; font-size: 13px; font-family: var(--jp); color: var(--dim); }
.lock-msg.err { color: var(--warn-text); }
.lock-panel.shake { animation: shake 0.35s; }
@keyframes shake {
  20% { transform: translateX(-6px); }
  40% { transform: translateX(6px); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(4px); }
}

/* ---------- 解除後 ---------- */
.app-header {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 8px 20px;
  padding: 16px 20px 8px;
}
.app-title {
  font-family: var(--jp);
  font-weight: 700;
  font-size: 24px;
  letter-spacing: 0.2em;
  color: var(--hi);
  text-shadow: 0 0 12px var(--glow);
}
.app-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; font-size: 13px; }
.app-tools .meter { color: var(--dim); white-space: nowrap; }
.app-tools .meter b { color: var(--hi); font-weight: 400; }
.navbar {
  position: relative;
  z-index: 20;
  display: flex;
  align-items: stretch;
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--line);
  box-shadow: 0 1px 0 var(--glow-soft);
}
.tabs {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  gap: 0 2px;
  padding: 0 12px;
  overflow-x: auto;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.navbar-tools {
  display: flex;
  align-items: center;
  max-width: 0;
  overflow: hidden;
  opacity: 0;
  transition: max-width 0.2s, opacity 0.2s;
}
.btn-mini { min-height: 30px; padding: 0 12px; font-size: 12px; box-shadow: none; }
.tab {
  display: inline-flex;
  align-items: center;
  min-height: 40px;
  padding: 0 12px;
  text-decoration: none;
  color: var(--dim);
  border-bottom: 2px solid transparent;
  white-space: nowrap;
}
.tab:hover { color: var(--hi); border-bottom-color: var(--mid); }
.sections {
  max-width: 1220px;
  margin: 0 auto;
  padding: 28px 16px 0;
  display: flex;
  flex-wrap: wrap;
  gap: 22px;
}
.sec { min-width: 0; padding: 18px 22px; display: flex; flex-direction: column; gap: 14px; }
.sec.half { flex: 1 1 460px; }
.sec.full { flex: 1 1 100%; }
.sec-h {
  margin: 0;
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 2px 12px;
  font-size: 13px;
  font-weight: 400;
  letter-spacing: 0.15em;
}
.sec-no { color: var(--tone, var(--accent)); }
.sec > * { position: relative; }
.sec-mark { display: none; }

/* ---------- 章の見分け方（site.ui.sectionStyle） ---------- */

/* A tone: 地の段差。明るさだけを交互に変える */
.ss-tone .sec.odd { background: rgba(9, 17, 23, 0.92); }
.ss-tone .sec.even { background: rgba(19, 35, 46, 0.92); }

/* B meaning: 意味のハッチング。中身で模様が決まる */
.ss-meaning .sec.kind-sealed {
  background-image: repeating-linear-gradient(135deg, color-mix(in srgb, var(--accent) 7%, transparent) 0 1px, transparent 1px 9px);
}
.ss-meaning .sec.kind-live {
  background-image: radial-gradient(color-mix(in srgb, var(--accent) 14%, transparent) 1px, transparent 1.5px);
  background-size: 12px 12px;
}

/* C module: 見出しを帯に載せる。帯の濃さを交互に */
.ss-module .sec-h {
  margin: -18px -22px 0;
  padding: 10px 22px;
  background: color-mix(in srgb, var(--tone, var(--accent)) 7%, transparent);
  border-bottom: 1px solid var(--line);
}
.ss-module .sec.even .sec-h { background: color-mix(in srgb, var(--tone, var(--accent)) 13%, transparent); }
.ss-module .sec-no { border: 1px solid currentColor; padding: 0 6px; }

/* D index: 区画番号。白抜きの大きな番号と上辺の目盛り */
.ss-index .sec-mark {
  display: block;
  position: absolute;
  top: 10px;
  right: 16px;
  font-family: var(--mono);
  font-size: 64px;
  line-height: 1;
  color: transparent;
  -webkit-text-stroke: 1px color-mix(in srgb, var(--tone, var(--accent)) 28%, transparent);
  pointer-events: none;
  user-select: none;
}
.ss-index .sec {
  background-image: repeating-linear-gradient(90deg, color-mix(in srgb, var(--tone, var(--accent)) 35%, transparent) 0 1px, transparent 1px 12px);
  background-size: 100% 5px;
  background-repeat: no-repeat;
  background-position: 0 0;
}

.sec-title { color: var(--hi); }
.sec-sub { font-family: var(--jp); letter-spacing: 0.05em; color: var(--dim); }
.app-foot { max-width: 1220px; margin: 32px auto 0; }
.app-foot .ruler { margin: 0 16px; }
.app-foot p { margin: 6px 16px 0; font-size: 12px; color: var(--dim); letter-spacing: 0.1em; }

/* ---------- ブロック ---------- */
.b-steps, .b-list { margin: 0; padding-left: 2em; font-family: var(--jp); line-height: 1.9; }
.b-group { display: flex; flex-direction: column; gap: 4px; }
.b-title { margin: 0; font-size: 12px; font-weight: 400; letter-spacing: 0.15em; color: var(--tone, var(--accent)); font-family: var(--mono); }
.b-text { margin: 0; font-family: var(--jp); white-space: pre-line; }
.b-note { font-size: 12px; color: var(--dim); font-family: var(--jp); white-space: pre-line; }

.rows > .row { border-bottom: 1px solid var(--line-soft); padding: 7px 0; }
.rows > .row:last-child { border-bottom: 0; }

.contact { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 14px; }
.contact .c-label { flex: 0 0 5.5em; font-family: var(--jp); font-size: 12px; color: var(--dim); }
.contact .c-name { flex: 1 1 80px; font-family: var(--jp); color: var(--hi); }
.contact .c-note { flex: 1 1 100%; padding-left: calc(5.5em + 14px); font-family: var(--jp); font-size: 12px; color: var(--dim); }

.totp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 0 28px; }
.totp { padding: 14px 0; border-bottom: 1px solid var(--line-soft); display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.totp-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.totp-name { color: var(--hi); letter-spacing: 0.1em; overflow-wrap: anywhere; }
.totp-acct { font-size: 12px; color: var(--dim); overflow-wrap: anywhere; text-align: right; }
.totp-code-row { display: flex; align-items: baseline; gap: 14px; }
.totp-code {
  padding: 0;
  background: none;
  border: 0;
  font-family: var(--mono);
  font-size: 40px;
  line-height: 1.1;
  letter-spacing: 0.08em;
  color: var(--hi);
  text-shadow: 0 0 12px var(--glow);
  cursor: copy;
  font-variant-numeric: tabular-nums;
}
.totp-code:hover { color: var(--accent); }
.totp-t { font-size: 12px; color: var(--accent); white-space: nowrap; }
.gauge {
  position: relative;
  display: block;
  height: 10px;
  background-image: repeating-linear-gradient(90deg, var(--line) 0 2px, transparent 2px 6px);
}
.gauge > i {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  background-image: repeating-linear-gradient(90deg, var(--accent) 0 2px, transparent 2px 6px);
  filter: drop-shadow(0 0 3px var(--accent));
}
.gauge.low > i { background-image: repeating-linear-gradient(90deg, var(--warn) 0 2px, transparent 2px 6px); filter: drop-shadow(0 0 3px var(--warn)); }

.secret-row { display: grid; grid-template-columns: 4.5em minmax(0, 1fr) auto; align-items: center; gap: 6px 8px; }
.secret-row .k { color: var(--dim); font-size: 12px; letter-spacing: 0.08em; }
.secret-row .v { min-width: 0; font-family: var(--mono); overflow-wrap: anywhere; }
.btns { display: inline-flex; gap: 6px; }

.codes-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 330px), 1fr)); gap: 18px; }
.codes { border: 1px solid var(--line-soft); background: rgba(7, 13, 18, 0.7); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.codes-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.codes-head .name { color: var(--hi); letter-spacing: 0.1em; }
.codes-head .count { font-size: 12px; color: var(--dim); font-family: var(--jp); }
.codes-head .grow, .secret-head .grow { flex: 1 1 0; }
.codes-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 0 10px; }
.codes-list > span { min-height: 30px; display: flex; align-items: center; gap: 8px; }
.codes-list .n { color: var(--mid); }

.secret-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.secret-head .name { color: var(--hi); }
.secret-pre {
  margin: 0;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  background: var(--bg);
  border: 1px solid var(--line-soft);
  padding: 12px 14px;
  font-family: var(--mono);
  font-size: 14px;
  line-height: 1.8;
  color: var(--text);
}

.entries { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 14px 24px; }
.entry { display: flex; flex-direction: column; gap: 2px; min-width: 0; border-top: 1px solid var(--line-soft); padding-top: 10px; }
.entry-name { color: var(--hi); letter-spacing: 0.08em; font-family: var(--jp); overflow-wrap: anywhere; }
.entry-sub { font-family: var(--jp); font-size: 12px; color: var(--dim); }
.entry-note { font-family: var(--jp); font-size: 12px; color: var(--dim); white-space: pre-line; }
.field { display: grid; grid-template-columns: 5em minmax(0, 1fr) auto; align-items: center; gap: 2px 10px; min-height: 30px; }
.field .k { color: var(--dim); font-size: 12px; font-family: var(--jp); line-height: 1.4; }
.field .v { min-width: 0; overflow-wrap: anywhere; }
.field > .v:last-child { grid-column: 2 / -1; }
.field .v.jp { font-family: var(--jp); }
.field.big .v { font-size: 22px; line-height: 1.3; }
.tone-warn .field.big .v a { color: var(--warn-text); }

.toast {
  position: fixed;
  left: 50%;
  bottom: 18px;
  transform: translateX(-50%);
  padding: 8px 14px;
  border: 1px solid var(--accent);
  background: var(--bg);
  color: var(--hi);
  font-size: 13px;
  box-shadow: 0 0 14px var(--glow-soft);
  opacity: 0;
  transition: opacity 0.2s;
  pointer-events: none;
}
.toast.show { opacity: 1; }

/* ---------- スマホ ---------- */
@media (max-width: 640px) {
  /* スマホ：目次を上端に固定して、今いる章を光らせる（PC は 2 段組なのでやらない） */
  html { scroll-padding-top: 56px; }
  .navbar { position: sticky; top: 0; }
  .navbar.stuck .navbar-tools { max-width: 80px; opacity: 1; padding: 0 10px 0 6px; }
  .tab.active { color: var(--hi); border-bottom-color: var(--accent); text-shadow: 0 0 8px var(--glow); }
  .sec.current { border-color: color-mix(in srgb, var(--tone, var(--accent)) 45%, var(--line)); }
  .sec.current .sec-no { text-shadow: 0 0 8px var(--tone, var(--accent)); }
  .ss-index .sec.current .sec-mark { -webkit-text-stroke-color: color-mix(in srgb, var(--tone, var(--accent)) 60%, transparent); }
  .topbar { padding: 12px 14px 8px; }
  .lock-center { padding: 24px 12px; align-items: flex-start; }
  .lock-panel { padding: 26px 18px 22px; }
  .lock-title { font-size: 40px; }
  .pass-row .btn-primary { flex: 1 1 100%; }
  .app-header { padding: 14px 14px 6px; }
  .app-tools { width: 100%; gap: 8px 10px; font-size: 12px; }
  .app-tools .btn, .app-tools .btn-primary { padding: 0 10px; }
  .app-tools .btn-primary { margin-left: auto; }
  .tabs { padding: 0 6px; }
  .sections { padding: 20px 10px 0; gap: 18px; }
  .sec { padding: 16px 14px; }
  .sec.half { flex-basis: 100%; }
  .totp-code { font-size: 34px; }
  .ss-module .sec-h { margin: -16px -14px 0; padding: 10px 14px; }
  .ss-index .sec-mark { font-size: 48px; right: 10px; }
  .contact .c-note { padding-left: 0; }
  .ruler { margin: 0 12px 12px; }
}

@media (prefers-reduced-motion: reduce) {
  .scan { display: none; }
  .lock-panel.shake { animation: none; }
}

@media print {
  body { background: #fff; color: #000; }
  .topbar, .glowline, .tabs, .app-tools, .btn, .ruler, .scan { display: none !important; }
  .panel { border-color: #999; background: #fff; box-shadow: none; }
}

</style>
</head>
<body>

<script>
/* src/core.js */
/*
 * 非常口 — 暗号と TOTP のコア
 *
 * このファイルはブラウザ（ビルド時に HTML へインライン）と Node（scripts/）の
 * 両方で「同じもの」を使う。片方だけ直すと復号できなくなるので、変更したら
 * 必ず `npm test` を通すこと。
 *
 * 依存: globalThis.hashwasm（hash-wasm の argon2id）、WebCrypto（crypto.subtle）
 *
 * 暗号の形式（v1）
 *   データ鍵（DEK, 256bit ランダム）で中身を AES-256-GCM 暗号化する。
 *   DEK は「鍵スロット」ごとに、合言葉から Argon2id で導いた鍵で包んで保存する。
 *   スロットは配列で持つ（今は合言葉の 1 つだけ）。
 */
(function (root) {
  'use strict';

  var FORMAT = 'hijouguchi-vault';
  var VERSION = 1;
  var AAD_DATA = 'hijouguchi/v1/data';
  var AAD_SLOT = 'hijouguchi/v1/slot';
  var DEFAULT_KDF = { alg: 'argon2id', m: 65536, t: 3, p: 1 }; // m は KiB（= 64 MiB）
  var B32 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';

  var enc = new TextEncoder();
  var dec = new TextDecoder();

  function subtle() {
    if (!root.crypto || !root.crypto.subtle) {
      throw new Error('WebCrypto が使えません（https か file:// で開いてください）');
    }
    return root.crypto.subtle;
  }

  /* ---------- base64 / 乱数 ---------- */

  function b64(bytes) {
    var s = '';
    for (var i = 0; i < bytes.length; i += 0x8000) {
      s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(s);
  }

  function unb64(str) {
    var s = atob(str);
    var out = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
    return out;
  }

  function random(n) {
    var a = new Uint8Array(n);
    root.crypto.getRandomValues(a);
    return a;
  }

  /* ---------- 鍵導出と AES-GCM ---------- */

  // 改ざんされたページで極端な値を渡されても止まらないように、範囲を決めておく
  function checkKdf(kdf) {
    var ok = kdf && kdf.alg === 'argon2id' &&
      Number.isInteger(kdf.m) && kdf.m >= 1024 && kdf.m <= 1048576 &&
      Number.isInteger(kdf.t) && kdf.t >= 1 && kdf.t <= 20 &&
      Number.isInteger(kdf.p) && kdf.p >= 1 && kdf.p <= 4;
    if (!ok) throw new Error('未対応の鍵導出パラメータです');
  }

  async function deriveKey(passphrase, salt, kdf) {
    checkKdf(kdf);
    if (!root.hashwasm || !root.hashwasm.argon2id) throw new Error('argon2id が読み込まれていません');
    var raw = await root.hashwasm.argon2id({
      password: String(passphrase).normalize('NFC'),
      salt: salt,
      parallelism: kdf.p,
      iterations: kdf.t,
      memorySize: kdf.m,
      hashLength: 32,
      outputType: 'binary'
    });
    return subtle().importKey('raw', raw, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
  }

  function importDek(dek) {
    return subtle().importKey('raw', dek, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
  }

  async function aesEncrypt(key, iv, data, aad) {
    var ct = await subtle().encrypt({ name: 'AES-GCM', iv: iv, additionalData: enc.encode(aad) }, key, data);
    return new Uint8Array(ct);
  }

  async function aesDecrypt(key, iv, data, aad) {
    var pt = await subtle().decrypt({ name: 'AES-GCM', iv: iv, additionalData: enc.encode(aad) }, key, data);
    return new Uint8Array(pt);
  }

  /* ---------- スロットと金庫 ---------- */

  function newDek() {
    return random(32);
  }

  async function makeSlot(passphrase, dek, kdf, label) {
    kdf = kdf || DEFAULT_KDF;
    var salt = random(16);
    var iv = random(12);
    var kek = await deriveKey(passphrase, salt, kdf);
    var wrapped = await aesEncrypt(kek, iv, dek, AAD_SLOT);
    return {
      label: label || 'passphrase',
      kdf: { alg: kdf.alg, m: kdf.m, t: kdf.t, p: kdf.p },
      salt: b64(salt),
      iv: b64(iv),
      key: b64(wrapped)
    };
  }

  function checkVault(vault) {
    if (!vault || vault.format !== FORMAT) throw new Error('非常口の暗号データではありません');
    if (vault.v !== VERSION) throw new Error('未対応のバージョンです: ' + vault.v);
    if (!Array.isArray(vault.slots) || vault.slots.length === 0) throw new Error('鍵スロットがありません');
  }

  async function tryUnwrap(slot, passphrase) {
    var kek = await deriveKey(passphrase, unb64(slot.salt), slot.kdf);
    try {
      return await aesDecrypt(kek, unb64(slot.iv), unb64(slot.key), AAD_SLOT);
    } catch (e) {
      return null; // 合言葉違い（GCM の認証失敗）
    }
  }

  // どれかのスロットが開けば DEK を返す。開かなければ null。
  async function openSlots(vault, passphrase, onTry) {
    checkVault(vault);
    for (var i = 0; i < vault.slots.length; i++) {
      if (onTry) onTry(i, vault.slots.length);
      var dek = await tryUnwrap(vault.slots[i], passphrase);
      if (dek) return dek;
    }
    return null;
  }

  async function seal(dek, slots, payload) {
    var iv = random(12);
    var key = await importDek(dek);
    var ct = await aesEncrypt(key, iv, enc.encode(JSON.stringify(payload)), AAD_DATA);
    return { format: FORMAT, v: VERSION, slots: slots, iv: b64(iv), data: b64(ct) };
  }

  async function openWithDek(vault, dek) {
    checkVault(vault);
    var key = await importDek(dek);
    var pt = await aesDecrypt(key, unb64(vault.iv), unb64(vault.data), AAD_DATA);
    return JSON.parse(dec.decode(pt));
  }

  // 合言葉で開く。失敗したら null。
  async function unlock(vault, passphrase, onTry) {
    var dek = await openSlots(vault, passphrase, onTry);
    if (!dek) return null;
    var payload = await openWithDek(vault, dek);
    return { dek: dek, payload: payload };
  }

  /* ---------- TOTP（RFC 6238） ---------- */

  function base32Decode(input) {
    var s = String(input).toUpperCase().replace(/[\s-]/g, '').replace(/=+$/, '');
    var bits = 0;
    var val = 0;
    var out = [];
    for (var i = 0; i < s.length; i++) {
      var idx = B32.indexOf(s[i]);
      if (idx < 0) throw new Error('base32 として不正な文字があります: ' + s[i]);
      val = ((val << 5) | idx) & 0xffff;
      bits += 5;
      if (bits >= 8) {
        out.push((val >>> (bits - 8)) & 0xff);
        bits -= 8;
      }
    }
    return new Uint8Array(out);
  }

  function hashName(algorithm) {
    var a = String(algorithm || 'SHA1').toUpperCase().replace(/^SHA-?/, '');
    if (a === '1' || a === '256' || a === '512') return 'SHA-' + a;
    throw new Error('未対応のハッシュ: ' + algorithm);
  }

  async function totp(secretBytes, opts, timeMs) {
    opts = opts || {};
    var period = opts.period || 30;
    var digits = opts.digits || 6;
    var counter = Math.floor(timeMs / 1000 / period);
    var msg = new Uint8Array(8);
    for (var i = 7; i >= 0; i--) {
      msg[i] = counter % 256;
      counter = Math.floor(counter / 256);
    }
    var key = await subtle().importKey('raw', secretBytes, { name: 'HMAC', hash: hashName(opts.algorithm) }, false, ['sign']);
    var mac = new Uint8Array(await subtle().sign('HMAC', key, msg));
    var off = mac[mac.length - 1] & 15;
    var bin = ((mac[off] & 127) << 24) | (mac[off + 1] << 16) | (mac[off + 2] << 8) | mac[off + 3];
    return String(bin % Math.pow(10, digits)).padStart(digits, '0');
  }

  root.HJGCore = {
    FORMAT: FORMAT,
    VERSION: VERSION,
    DEFAULT_KDF: DEFAULT_KDF,
    b64: b64,
    unb64: unb64,
    random: random,
    newDek: newDek,
    makeSlot: makeSlot,
    openSlots: openSlots,
    seal: seal,
    openWithDek: openWithDek,
    unlock: unlock,
    base32Decode: base32Decode,
    hashName: hashName,
    totp: totp
  };
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>
/* src/app.js */
/*
 * 非常口 — 画面
 * 公開情報（hjg-public）でロック画面を出し、合言葉で暗号データ（hjg-vault）を開いて描画する。
 * 中身はすべて設定ファイル（vault.yaml）から来る。ここには個人情報を書かない。
 */
(function () {
  'use strict';

  var C = window.HJGCore;
  var PUB = JSON.parse(document.getElementById('hjg-public').textContent);
  var VAULT = JSON.parse(document.getElementById('hjg-vault').textContent);
  var L = PUB.labels;
  var root = document.getElementById('root');
  var MASK = '▮▮▮▮▮▮▮▮';

  var state = null; // 解除中だけ存在する

  /* ---------- 小道具 ---------- */

  function h(tag, attrs) {
    var el = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        var v = attrs[k];
        if (v === null || v === undefined || v === false) return;
        if (k === 'class') el.className = v;
        else if (k.slice(0, 2) === 'on' && typeof v === 'function') el.addEventListener(k.slice(2), v);
        else el.setAttribute(k, v === true ? '' : String(v));
      });
    }
    for (var i = 2; i < arguments.length; i++) append(el, arguments[i]);
    return el;
  }

  function append(el, c) {
    if (c === null || c === undefined || c === false) return;
    if (Array.isArray(c)) {
      c.forEach(function (x) { append(el, x); });
      return;
    }
    el.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
  }

  function pad(n) { return String(n).padStart(2, '0'); }

  function stamp(d) {
    return d.getFullYear() + '.' + pad(d.getMonth() + 1) + '.' + pad(d.getDate()) + ' ' +
      pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  }

  function isJa(s) { return /[^\x00-\x7f]/.test(s); }

  function telHref(v) {
    var digits = String(v).replace(/[^0-9+#*]/g, '');
    return digits ? 'tel:' + digits : null;
  }

  function groupCode(code) {
    if (code.length === 6) return code.slice(0, 3) + ' ' + code.slice(3);
    if (code.length === 8) return code.slice(0, 4) + ' ' + code.slice(4);
    return code;
  }

  function sectionLabels(sections) {
    var map = {};
    sections.forEach(function (s, i) { map[s.id] = pad(i + 1) + ' ' + s.title; });
    return map;
  }

  // [文字](#章id) / [文字](https://…) / [文字](tel:…) だけをリンクにする。[](#章id) は章名になる。
  function inline(text) {
    var out = [];
    var re = /\[([^\]]*)\]\(([^)\s]+)\)/g;
    var last = 0;
    var m;
    while ((m = re.exec(text))) {
      if (m.index > last) out.push(text.slice(last, m.index));
      var href = m[2];
      var label = m[1];
      var a = null;
      if (href.charAt(0) === '#') {
        var id = href.slice(1);
        a = h('a', { href: '#sec-' + id }, label || (state && state.labels[id]) || id);
      } else if (/^https?:\/\//i.test(href)) {
        a = h('a', { href: href, target: '_blank', rel: 'noopener noreferrer' }, label || href);
      } else if (/^(tel|mailto):/i.test(href)) {
        a = h('a', { href: href }, label || href.replace(/^\w+:/, ''));
      }
      out.push(a || m[0]);
      last = re.lastIndex;
    }
    if (last < text.length) out.push(text.slice(last));
    return out;
  }

  /* ---------- 時計（常時） ---------- */

  function tickClock() {
    var t = stamp(new Date());
    var els = document.querySelectorAll('.clock');
    for (var i = 0; i < els.length; i++) els[i].textContent = t;
  }
  setInterval(tickClock, 1000);

  function topbar(unlocked) {
    return [
      h('div', { class: 'topbar' },
        h('span', { class: 'status' },
          h('span', { class: 'status-dot' + (unlocked ? ' on' : ''), 'aria-hidden': 'true' }),
          unlocked ? L.unlocked : L.locked),
        h('span', { class: 'clock' }, stamp(new Date()))),
      h('div', { class: 'glowline', 'aria-hidden': 'true' })
    ];
  }

  /* ---------- ロック画面 ---------- */

  function chip(k, v) {
    return h('span', { class: 'chip' }, h('span', null, k), v);
  }

  function renderLock(message, isError) {
    state = null;
    root.textContent = '';
    document.title = PUB.title;

    var input = h('input', {
      class: 'pass-input', id: 'pp', type: 'password', autocomplete: 'off',
      autocapitalize: 'off', autocorrect: 'off', spellcheck: 'false', placeholder: '— — — — — —'
    });
    var btn = h('button', { class: 'btn-primary', type: 'submit' }, PUB.lock.button);
    var show = h('input', { type: 'checkbox' });
    show.addEventListener('change', function () { input.type = show.checked ? 'text' : 'password'; });
    var msg = h('div', { class: 'lock-msg' + (isError ? ' err' : ''), role: 'status', 'aria-live': 'polite' }, message || '');
    var kdf = (VAULT.slots && VAULT.slots[0] && VAULT.slots[0].kdf && VAULT.slots[0].kdf.alg) || 'argon2id';

    var form = h('form', { class: 'panel big lock-panel', autocomplete: 'off', novalidate: true },
      h('span', { class: 'c-tr' }), h('span', { class: 'c-bl' }),
      h('div', null,
        h('div', { class: 'lock-label' }, PUB.lock.label),
        h('h1', { class: 'lock-title' }, PUB.title),
        PUB.lock.greeting ? h('div', { class: 'lock-greeting' }, PUB.lock.greeting) : null),
      h('div', { class: 'chips' },
        chip('CIPHER', 'AES-256-GCM'),
        chip('KDF', kdf.toUpperCase()),
        chip('UPDATED', PUB.updated)),
      h('div', { style: 'display:flex;flex-direction:column;gap:8px' },
        h('label', { class: 'pass-label', for: 'pp' }, PUB.lock.passphraseLabel),
        h('div', { class: 'pass-row' }, input, btn),
        h('label', { class: 'check' }, show, PUB.lock.showInput)),
      msg);

    var busy = false;
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (busy || !input.value) return;
      busy = true;
      btn.disabled = true;
      input.readOnly = true;
      msg.className = 'lock-msg';
      msg.textContent = L.deriving;
      var pass = input.value;
      // 表示を更新してから重い計算に入る
      setTimeout(function () {
        C.unlock(VAULT, pass, function (i, n) {
          if (n > 1) msg.textContent = L.deriving + ' (' + (i + 1) + '/' + n + ')';
        }).then(function (res) {
          pass = null;
          if (!res) {
            busy = false;
            btn.disabled = false;
            input.readOnly = false;
            msg.className = 'lock-msg err';
            msg.textContent = L.denied;
            form.classList.remove('shake');
            void form.offsetWidth;
            form.classList.add('shake');
            input.select();
            return;
          }
          input.value = '';
          renderApp(res.payload.data);
        }, function (err) {
          busy = false;
          btn.disabled = false;
          input.readOnly = false;
          msg.className = 'lock-msg err';
          msg.textContent = 'ERROR: ' + (err && err.message ? err.message : err);
        });
      }, 40);
    });

    root.appendChild(h('div', { class: 'lock-screen' },
      h('div', { class: 'scan', 'aria-hidden': 'true' }),
      topbar(false),
      h('div', { class: 'lock-center' }, form),
      h('div', { class: 'ruler', 'aria-hidden': 'true' })));
    input.focus();
  }

  /* ---------- 秘密の表示・コピー ---------- */

  function secret(value, paintFn) {
    var s = { value: value, shown: false, els: [], btns: [], paint: paintFn || null };
    state.secrets.push(s);
    return s;
  }

  function paint(s) {
    s.els.forEach(function (el) {
      if (s.paint) s.paint(el, s.shown);
      else el.textContent = s.shown ? s.display || s.value : MASK;
    });
    s.btns.forEach(function (b) {
      b.textContent = s.shown ? L.hide : L.show;
      b.setAttribute('aria-pressed', String(s.shown));
    });
  }

  function secretEl(s, tag, cls) {
    var el = h(tag, { class: cls });
    s.els.push(el);
    paint(s);
    return el;
  }

  function toggleBtn(s, what) {
    var b = h('button', { class: 'btn', type: 'button', 'aria-pressed': 'false', 'aria-label': what ? what + ' ' + L.show : null });
    b.addEventListener('click', function () {
      s.shown = !s.shown;
      paint(s);
    });
    s.btns.push(b);
    paint(s);
    return b;
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text);
    }
    // http や古いブラウザ向け
    var ta = h('textarea', { style: 'position:fixed;left:-9999px;top:0', readonly: true });
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok ? Promise.resolve() : Promise.reject(new Error('copy failed'));
  }

  function copyBtn(getText, what) {
    var b = h('button', { class: 'btn', type: 'button', 'aria-label': what ? what + ' ' + L.copy : null }, L.copy);
    var timer = null;
    b.addEventListener('click', function () {
      copyText(getText()).then(function () {
        b.textContent = L.copied;
        clearTimeout(timer);
        timer = setTimeout(function () { b.textContent = L.copy; }, 1400);
      }, function () {
        b.textContent = '×';
        clearTimeout(timer);
        timer = setTimeout(function () { b.textContent = L.copy; }, 1400);
      });
    });
    return b;
  }

  function hideAll() {
    if (!state) return;
    state.secrets.forEach(function (s) {
      s.shown = false;
      paint(s);
    });
  }

  var toastEl = null;
  var toastTimer = null;
  function toast(text) {
    if (!toastEl) {
      toastEl = h('div', { class: 'toast', role: 'status', 'aria-live': 'polite' });
      document.body.appendChild(toastEl);
    }
    toastEl.textContent = text;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1400);
  }

  /* ---------- ブロック ---------- */

  function blockSteps(b) {
    return h('ol', { class: 'b-steps' }, b.items.map(function (t) { return h('li', null, inline(t)); }));
  }

  function blockList(b) {
    return h(b.ordered ? 'ol' : 'ul', { class: 'b-list' }, b.items.map(function (t) { return h('li', null, inline(t)); }));
  }

  function blockContacts(b) {
    return h('div', { class: 'rows' }, b.items.map(function (c) {
      var tel = c.tel ? telHref(c.tel) : null;
      return h('div', { class: 'row contact' },
        h('span', { class: 'c-label' }, c.label),
        h('span', { class: 'c-name' }, c.name),
        c.tel ? (tel ? h('a', { href: tel }, c.tel) : h('span', null, c.tel)) : null,
        c.note ? h('span', { class: 'c-note' }, inline(c.note)) : null);
    }));
  }

  function blockTotp(b) {
    return h('div', { class: 'totp-grid' }, b.items.map(function (item) {
      var t = { item: item, bytes: C.base32Decode(item.secret), step: -1, code: '' };
      t.codeEl = h('button', { class: 'totp-code', type: 'button', title: L.copy, 'aria-label': item.name + ' ' + L.copy }, '--- ---');
      t.codeEl.addEventListener('click', function () {
        if (!t.code) return;
        copyText(t.code).then(function () { toast(item.name + ' ' + L.codeCopied); }, function () {});
      });
      t.tEl = h('span', { class: 'totp-t' }, '');
      t.fill = h('i', null);
      t.gauge = h('span', { class: 'gauge', 'aria-hidden': 'true' }, t.fill);
      state.totps.push(t);
      var s = secret(item.secret);
      s.display = item.secret.match(/.{1,4}/g).join(' ');
      return h('div', { class: 'totp' },
        h('div', { class: 'totp-head' },
          h('span', { class: 'totp-name' }, item.name),
          item.account ? h('span', { class: 'totp-acct' }, item.account) : null),
        h('div', { class: 'totp-code-row' }, t.codeEl, t.tEl),
        t.gauge,
        h('div', { class: 'secret-row' },
          h('span', { class: 'k' }, L.seed),
          secretEl(s, 'code', 'v'),
          h('span', { class: 'btns' },
            toggleBtn(s, item.name),
            copyBtn(function () { return item.secret; }, item.name))));
    }));
  }

  function blockCodes(b) {
    return h('div', { class: 'codes-grid' }, b.items.map(function (g) {
      var s = secret(g.codes.join('\n'), function (el, shown) {
        el.textContent = '';
        g.codes.forEach(function (c, i) {
          el.appendChild(h('span', null, h('span', { class: 'n' }, pad(i + 1)), shown ? c : MASK));
        });
      });
      return h('div', { class: 'codes' },
        h('div', { class: 'codes-head' },
          h('span', { class: 'name' }, g.name),
          h('span', { class: 'count' }, g.codes.length + '件'),
          h('span', { class: 'grow' }),
          toggleBtn(s, g.name),
          copyBtn(function () { return g.codes.join('\n'); }, g.name)),
        secretEl(s, 'div', 'codes-list'),
        g.note ? h('div', { class: 'b-note' }, inline(g.note)) : null);
    }));
  }

  function blockSecret(b) {
    var s = secret(b.text, function (el, shown) {
      el.textContent = shown ? b.text : [MASK, MASK, MASK].join('\n');
    });
    return h('div', { style: 'display:flex;flex-direction:column;gap:8px' },
      h('div', { class: 'secret-head' },
        h('span', { class: 'name' }, b.name),
        h('span', { class: 'grow' }),
        toggleBtn(s, b.name),
        copyBtn(function () { return b.text; }, b.name)),
      secretEl(s, 'pre', 'secret-pre'),
      b.note ? h('div', { class: 'b-note' }, inline(b.note)) : null);
  }

  function fieldValue(f) {
    if (f.type === 'tel') {
      var tel = telHref(f.value);
      return tel ? h('a', { href: tel }, f.value) : f.value;
    }
    if (f.type === 'url' && /^https?:\/\//i.test(f.value)) {
      return h('a', { href: f.value, target: '_blank', rel: 'noopener noreferrer' }, f.value);
    }
    if (f.type === 'email') return h('a', { href: 'mailto:' + f.value }, f.value);
    return f.value;
  }

  function blockEntries(b) {
    return h('div', { class: 'entries' }, b.items.map(function (e) {
      return h('div', { class: 'entry' },
        h('div', { class: 'entry-name' }, e.name),
        e.sub ? h('div', { class: 'entry-sub' }, e.sub) : null,
        e.fields.map(function (f) {
          var cls = 'field' + (f.big ? ' big' : '');
          if (f.secret) {
            var s = secret(f.value);
            var what = e.name + ' ' + f.label;
            return h('div', { class: cls },
              h('span', { class: 'k' }, f.label),
              secretEl(s, 'code', 'v'),
              h('span', { class: 'btns' }, toggleBtn(s, what), copyBtn(function () { return f.value; }, what)));
          }
          return h('div', { class: cls },
            h('span', { class: 'k' }, f.label),
            h('span', { class: 'v' + (isJa(f.value) ? ' jp' : '') }, fieldValue(f)));
        }),
        e.note ? h('div', { class: 'entry-note' }, inline(e.note)) : null);
    }));
  }

  // どのブロックにも title（小見出し）を付けられる
  function renderBlock(b) {
    var body = renderBlockBody(b);
    if (!b.title) return body;
    return h('div', { class: 'b-group' }, h('h3', { class: 'b-title' }, b.title), body);
  }

  function renderBlockBody(b) {
    switch (b.type) {
      case 'steps': return blockSteps(b);
      case 'list': return blockList(b);
      case 'text': return h('p', { class: 'b-text' }, inline(b.text));
      case 'note': return h('div', { class: 'b-note' }, inline(b.text));
      case 'contacts': return blockContacts(b);
      case 'totp': return blockTotp(b);
      case 'codes': return blockCodes(b);
      case 'secret': return blockSecret(b);
      case 'entries': return blockEntries(b);
      default: return null;
    }
  }

  /* ---------- 解除後 ---------- */

  function renderApp(data) {
    state = { secrets: [], totps: [], labels: sectionLabels(data.sections) };
    root.textContent = '';
    window.scrollTo(0, 0);

    var sections = data.sections.map(function (sec, i) {
      var cls = 'panel sec ' + sec.size + ' ' + (i % 2 ? 'even' : 'odd') + ' kind-' + kindOf(sec) +
        (sec.tone === 'warn' ? ' tone-warn' : '') + (sec.emphasis ? ' big emphasis' : '');
      return h('section', { class: cls, id: 'sec-' + sec.id, 'data-id': sec.id, 'aria-labelledby': 'h-' + sec.id },
        h('span', { class: 'sec-mark', 'aria-hidden': 'true' }, pad(i + 1)),
        sec.emphasis ? [h('span', { class: 'c-tr' }), h('span', { class: 'c-bl' })] : null,
        h('h2', { class: 'sec-h', id: 'h-' + sec.id },
          h('span', { class: 'sec-no' }, 'SEC.' + pad(i + 1)),
          h('span', { class: 'sec-title' }, sec.title),
          sec.subtitle ? h('span', { class: 'sec-sub' }, sec.subtitle) : null),
        sec.blocks.map(renderBlock));
    });

    var meterT = state.totps.length ? h('span', { class: 'meter' }, 'T-', h('b', null, ''), 's') : null;
    state.meterT = meterT && meterT.querySelector('b');

    state.tabEls = {};
    var tabs = h('nav', { class: 'tabs', 'aria-label': L.sections },
      data.sections.map(function (sec) {
        var a = h('a', { class: 'tab', href: '#sec-' + sec.id }, state.labels[sec.id]);
        state.tabEls[sec.id] = a;
        return a;
      }));
    var header = h('header', { class: 'app-header' },
      h('span', { class: 'app-title' }, PUB.title),
      h('div', { class: 'app-tools' },
        meterT,
        h('button', { class: 'btn', type: 'button', onclick: hideAll }, L.hideAll),
        h('button', { class: 'btn-primary', type: 'button', onclick: lock }, L.lock + ' ■')));
    var navbar = h('div', { class: 'navbar' },
      tabs,
      h('div', { class: 'navbar-tools' },
        h('button', { class: 'btn-primary btn-mini', type: 'button', onclick: lock, 'aria-label': L.lock }, '■')));
    state.tabsEl = tabs;
    state.header = header;
    state.navbar = navbar;
    state.secEls = sections;
    state.current = '';

    root.appendChild(h('div', { class: 'app ss-' + PUB.ui.sectionStyle },
      topbar(true),
      header,
      navbar,
      h('main', { class: 'sections' }, sections),
      h('footer', { class: 'app-foot' },
        h('div', { class: 'ruler', 'aria-hidden': 'true' }),
        h('p', null, L.updated + ' ' + PUB.updated))));

    document.title = PUB.title + ' — ' + L.unlocked;
    state.timer = setInterval(tick, 250);
    tick();
    updateNav();
  }

  // 章の中身の種類（sectionStyle: meaning の模様に使う）
  //   live   … 刻々と変わる値がある（TOTP）
  //   sealed … 伏せた秘密がある（コード・パスワードなど）
  //   info   … それ以外
  function kindOf(sec) {
    var live = false;
    var sealed = false;
    sec.blocks.forEach(function (b) {
      if (b.type === 'totp') live = true;
      if (b.type === 'codes' || b.type === 'secret') sealed = true;
      if (b.type === 'entries') {
        b.items.forEach(function (e) {
          e.fields.forEach(function (f) { if (f.secret) sealed = true; });
        });
      }
    });
    return live ? 'live' : sealed ? 'sealed' : 'info';
  }

  /* ---------- 今いる章 ---------- */

  var navQueued = false;
  function scheduleNav() {
    if (navQueued) return;
    navQueued = true;
    requestAnimationFrame(function () {
      navQueued = false;
      updateNav();
    });
  }

  function updateNav() {
    if (!state || !state.navbar) return;
    var bar = state.navbar.getBoundingClientRect();
    state.navbar.classList.toggle('stuck', state.header.getBoundingClientRect().bottom <= bar.height);
    var line = bar.bottom + 24;
    var els = state.secEls;
    var cur = [];
    var doc = document.documentElement;
    if (window.innerHeight + window.scrollY >= doc.scrollHeight - 4) {
      // 一番下まで来たら最後の行
      var lastTop = els[els.length - 1].getBoundingClientRect().top;
      cur = els.filter(function (el) { return Math.abs(el.getBoundingClientRect().top - lastTop) < 2; });
    } else {
      els.forEach(function (el) {
        var r = el.getBoundingClientRect();
        if (r.top <= line && r.bottom > line) cur.push(el);
      });
      if (!cur.length) {
        if (els[0].getBoundingClientRect().top > line) cur = [];
        else return; // 章と章のすき間：そのまま
      }
    }
    var key = cur.map(function (el) { return el.getAttribute('data-id'); }).join(',');
    if (key === state.current) return;
    state.current = key;
    els.forEach(function (el) { el.classList.toggle('current', cur.indexOf(el) >= 0); });
    var first = null;
    Object.keys(state.tabEls).forEach(function (id) {
      var on = cur.some(function (el) { return el.getAttribute('data-id') === id; });
      var t = state.tabEls[id];
      t.classList.toggle('active', on);
      if (on) {
        t.setAttribute('aria-current', 'true');
        if (!first) first = t;
      } else t.removeAttribute('aria-current');
    });
    // 目次が横にスクロールする幅なら、光っているタブを見える位置へ
    if (first) {
      var tabs = state.tabsEl;
      var left = first.offsetLeft - tabs.offsetLeft;
      if (left < tabs.scrollLeft || left + first.offsetWidth > tabs.scrollLeft + tabs.clientWidth) {
        tabs.scrollTo({ left: Math.max(0, left - 24), behavior: 'smooth' });
      }
    }
  }

  window.addEventListener('scroll', scheduleNav, { passive: true });
  window.addEventListener('resize', scheduleNav);

  function tick() {
    if (!state) return;
    var now = Date.now();
    var sec = Math.floor(now / 1000);
    state.totps.forEach(function (t) {
      var p = t.item.period;
      var step = Math.floor(sec / p);
      var remain = p - (sec % p);
      t.tEl.textContent = 'T-' + remain;
      t.fill.style.width = (remain / p * 100) + '%';
      t.gauge.classList.toggle('low', remain <= 5);
      if (step !== t.step) {
        t.step = step;
        C.totp(t.bytes, t.item, now).then(function (code) {
          if (t.step === step) {
            t.code = code;
            t.codeEl.textContent = groupCode(code);
          }
        });
      }
    });
    if (state.meterT) state.meterT.textContent = String(30 - (sec % 30));
  }

  function lock() {
    if (state && state.timer) clearInterval(state.timer);
    state = null;
    window.scrollTo(0, 0);
    renderLock();
  }

  renderLock();
})();

</script>
</body>
</html>
